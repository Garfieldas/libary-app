<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css">
    <title>Libary-app</title>
  </head>
  <body>
    <header>
      <div class="container row">
        <h1 class="title">Libary</h1>
        <button class="btn" id="addBook">Add book</button>
      </div>
    </header>
    <section>
      <div class="container">
          <div class="card-wrapper">
            <div class="card">
              <h3><i class="fa-solid fa-bookmark"></i> Book title</h3>
              <p><strong>Author</strong>: John Doe</p>
              <p><strong>Pages</strong>: 100</p>
              <div class="button-group">
              <button class="action-btn success">Read</button>
              <button class="action-btn danger">Remove</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="modal hidden">
      <form>
        <h3>Add new Book</h3>
        <div class="form-group">
          <label for="title">Title</label>
          <input id="title" required maxlength="20"/>
        </div>
        <div class="form-group">
          <label for="author">Author</label>
          <input id="author" required maxlength="20"/>
        </div>
        <div class="form-group">
          <label for="pages">Pages</label>
          <input id="pages" type="number" min="1" required/>
        </div>
        <button class="action-btn">Submit</button>
      </form>
    </div>
    <div class="overlay hidden"></div>
    <script type="module" src="/src/main.ts"></script>
  <script src="https://kit.fontawesome.com/bbf929e146.js" crossorigin="anonymous"></script>
  </body>
</html>
